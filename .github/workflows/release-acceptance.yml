name: Release acceptance

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Production commit SHA to accept
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-acceptance
  cancel-in-progress: true

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: site/.node-version
      - name: Verify release
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUIRE_APEX_REDIRECT: "true"
        run: node site/scripts/release-acceptance.mjs
