name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: site/.node-version
      - name: Verify production
        env:
          REQUIRE_APEX_REDIRECT: "true"
        run: node site/scripts/production-smoke.mjs
