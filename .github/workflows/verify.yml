name: Verify site and content tools

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Astro site
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Restore after npm ci, which removes node_modules. Cache only public image
      # derivatives, never Astro's content store, drafts, or local tool data.
      - name: Cache image transformations
        uses: actions/cache@v4
        with:
          path: site/node_modules/.astro/assets
          key: xgif-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('site/package-lock.json', 'site/astro.config.mjs', 'site/src/lib/display-image-service.mjs', 'site/src/components/DisplayImage.astro') }}-${{ github.sha }}
          restore-keys: |
            xgif-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('site/package-lock.json', 'site/astro.config.mjs', 'site/src/lib/display-image-service.mjs', 'site/src/components/DisplayImage.astro') }}-
      - run: npm run test && npm run test:visual:linux && npm run test:gallery
      - run: npm run check:deploy
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: site-visual-diffs
          path: site/test-results/
          if-no-files-found: ignore

  publisher:
    # Required by main branch protection; this job now tests CLI tools only.
    name: Local publisher
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: workflow/package-lock.json
      - run: npm ci
      - run: node --disable-warning=ExperimentalWarning recommendation-verify.js
      - run: npm run test:all
